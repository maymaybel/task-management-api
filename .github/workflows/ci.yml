
name: Task Manager CI Pipeline

on:
  push:
    branches: [main, feature/testing-ci-cd]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Automated Tests
        run: node --test
